# Three scheduled jobs and an on-demand backfill job, all on serverless compute.
#  - energy_daily:  ingest Elexon / ENTSO-E / FRED / stocks / gas / weather forecast, then
#    refresh the pipeline
#  - energy_forecast_archive: past forecast issues for the outlook backtest, an hour earlier
#  - energy_weekly_weather: pull a week of ERA5 (CDS queues can be slow, so weekly keeps
#    the billed waiting time down)
#  - energy_backfill: on-demand history backfill, month by month (see below)
#
# Cost guards: per-task timeouts, limited retries, one run at a time, and job-level timeouts.
#
# Serverless environment 4: its base image ships NumPy 2 with a matching pyarrow. On
# environment 2 our dependencies pulled in NumPy 2 next to the image's NumPy-1 pyarrow, and
# writing Parquet failed (ERA5).

resources:
  jobs:
    energy_daily:
      name: energy-daily
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 40 7 * * ?"     # 07:40 UK time
        timezone_id: Europe/London
        pause_status: ${var.schedule_pause}
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tags:
        project: energy-markets-lakehouse
      parameters:
        # Blank = each source's rolling window. Set both to backfill, e.g.
        #   databricks bundle run -t dev energy_daily --params start=2026-10-01,end=2026-10-31
        - name: start
          default: ""
        - name: end
          default: ""
      environments:
        - environment_key: ingest
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: ingest_elexon
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          environment_key: ingest
          timeout_seconds: 900
          max_retries: 2
          min_retry_interval_millis: 120000
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: ingest
            parameters:
              - --source=elexon
              - --start={{job.parameters.start}}
              - --end={{job.parameters.end}}
              - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: ingest_entsoe
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          environment_key: ingest
          timeout_seconds: 900
          max_retries: 2
          min_retry_interval_millis: 120000
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: ingest
            parameters:
              - --source=entsoe
              - --start={{job.parameters.start}}
              - --end={{job.parameters.end}}
              - --secret-scope=${var.secret_scope}
              - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: ingest_fred
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          environment_key: ingest
          timeout_seconds: 600
          max_retries: 2
          min_retry_interval_millis: 120000
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: ingest
            parameters:
              - --source=fred
              - --start={{job.parameters.start}}
              - --end={{job.parameters.end}}
              - --secret-scope=${var.secret_scope}
              - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: ingest_stocks
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          environment_key: ingest
          timeout_seconds: 600
          max_retries: 2
          min_retry_interval_millis: 120000
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: ingest
            parameters:
              - --source=stocks
              - --start={{job.parameters.start}}
              - --end={{job.parameters.end}}
              - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: ingest_gas
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          environment_key: ingest
          timeout_seconds: 600
          max_retries: 2
          min_retry_interval_millis: 120000
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: ingest
            parameters:
              - --source=gas
              - --start={{job.parameters.start}}
              - --end={{job.parameters.end}}
              - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: ingest_weather_forecast
          # Always the latest forecast: no start/end, and nothing to backfill.
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          environment_key: ingest
          timeout_seconds: 600
          max_retries: 2
          min_retry_interval_millis: 120000
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: ingest
            parameters:
              - --source=weather_forecast
              - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: refresh_pipeline
          # One flaky source shouldn't stop the others from flowing through.
          run_if: AT_LEAST_ONE_SUCCESS
          depends_on:
            - task_key: ingest_elexon
            - task_key: ingest_entsoe
            - task_key: ingest_fred
            - task_key: ingest_stocks
            - task_key: ingest_gas
            - task_key: ingest_weather_forecast
          pipeline_task:
            pipeline_id: ${resources.pipelines.energy_pipeline.id}
            full_refresh: false

    # Past forecast issues for the outlook backtest, kept out of energy_daily: Open-Meteo's
    # Previous Runs API can be slow or return broken responses from Databricks (28 Nov 2026),
    # and the backtest can wait a day. Runs an hour before energy_daily, whose pipeline
    # refresh picks the files up. Each issue is rebuilt 2 days on, once every forecast it
    # uses has been made; the default window refetches the issues from 14 to 2 days ago,
    # so a failed day catches up on the next run.
    energy_forecast_archive:
      name: energy-forecast-archive
      max_concurrent_runs: 1
      timeout_seconds: 2400
      schedule:
        quartz_cron_expression: "0 40 6 * * ?"     # 06:40 UK time
        timezone_id: Europe/London
        pause_status: ${var.schedule_pause}
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tags:
        project: energy-markets-lakehouse
      parameters:
        - name: start
          default: ""
        - name: end
          default: ""
      environments:
        - environment_key: ingest
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: ingest_weather_forecast_archive
          environment_key: ingest
          timeout_seconds: 600
          max_retries: 2
          min_retry_interval_millis: 120000
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: ingest
            parameters:
              - --source=weather_forecast_archive
              - --start={{job.parameters.start}}
              - --end={{job.parameters.end}}
              - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

    energy_weekly_weather:
      name: energy-weekly-weather
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 15 5 ? * MON"   # Mondays 05:15 UK time
        timezone_id: Europe/London
        pause_status: ${var.schedule_pause}
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tags:
        project: energy-markets-lakehouse
      parameters:
        # Blank = each source's rolling window. Set both to backfill, e.g.
        #   databricks bundle run -t dev energy_daily --params start=2026-10-01,end=2026-10-31
        - name: start
          default: ""
        - name: end
          default: ""
      environments:
        - environment_key: ingest
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: ingest_era5
          environment_key: ingest
          timeout_seconds: 5400
          max_retries: 1
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: ingest
            parameters:
              - --source=era5
              - --start={{job.parameters.start}}
              - --end={{job.parameters.end}}
              - --secret-scope=${var.secret_scope}
              - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing
        # No pipeline refresh here: the next daily run picks the new weather files up.

    # On-demand history backfill (no schedule). Cheaper than running energy_daily once per
    # month: each source loops over the months inside one job run, and the pipeline
    # refreshes once at the end instead of after every month.
    #
    #   databricks bundle run -t prod energy_backfill --params start_month=2024-01,end_month=current
    #   databricks bundle run -t prod energy_backfill --params "months=2024-03 2024-10"
    #   ...add include_weather=true for ERA5 (slow: the CDS queue can take an hour a month)
    #   ...or weather_only=true for ERA5 alone (skips Elexon, ENTSO-E, FRED, stocks, gas and
    #   the forecast archive)
    #   Months already landed and settled are skipped (rerunning only fills gaps); add
    #   refetch=true to download everything again.
    #
    # If some months fail, use "Repair run" in the Jobs UI: it reruns only the failed
    # iterations, then the pipeline refresh.
    energy_backfill:
      name: energy-backfill
      max_concurrent_runs: 1
      timeout_seconds: 43200                       # 12 h ceiling for very long backfills
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tags:
        project: energy-markets-lakehouse
      parameters:
        - name: start_month
          default: "2024-01"
        - name: end_month
          default: current                         # this month up to yesterday
        - name: months                             # optional list; overrides the range
          default: ""
        - name: include_weather
          default: "false"
        - name: weather_only                       # ERA5 only; implies include_weather
          default: "false"
        - name: refetch                            # true: re-download months already landed
          default: "false"
      environments:
        - environment_key: ingest
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: plan_months
          environment_key: ingest
          timeout_seconds: 300
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: plan_backfill
            parameters:
              - --start-month={{job.parameters.start_month}}
              - --end-month={{job.parameters.end_month}}
              - --months={{job.parameters.months}}
              - --include-weather={{job.parameters.include_weather}}
              - --weather-only={{job.parameters.weather_only}}

        # plan_months publishes run_markets / run_weather ("true"/"false") for these gates.
        - task_key: markets_requested
          depends_on:
            - task_key: plan_months
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.plan_months.values.run_markets}}"
            right: "true"

        # One for_each per source, one month per iteration. Concurrency is kept low to be
        # polite to the APIs (Yahoo especially) and to cap parallel serverless compute.
        - task_key: backfill_elexon
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          depends_on:
            - task_key: plan_months
            - task_key: markets_requested
              outcome: "true"
          for_each_task:
            inputs: "{{tasks.plan_months.values.months}}"
            concurrency: 2
            task:
              task_key: backfill_elexon_month
              environment_key: ingest
              timeout_seconds: 900
              max_retries: 2
              min_retry_interval_millis: 120000
              python_wheel_task:
                package_name: energy_lakehouse
                entry_point: ingest
                parameters:
                  - --source=elexon
                  - --start={{input.start}}
                  - --end={{input.end}}
                  - --refetch={{job.parameters.refetch}}
                  - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: backfill_entsoe
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          depends_on:
            - task_key: plan_months
            - task_key: markets_requested
              outcome: "true"
          for_each_task:
            inputs: "{{tasks.plan_months.values.months}}"
            concurrency: 2
            task:
              task_key: backfill_entsoe_month
              environment_key: ingest
              timeout_seconds: 900
              max_retries: 2
              min_retry_interval_millis: 120000
              python_wheel_task:
                package_name: energy_lakehouse
                entry_point: ingest
                parameters:
                  - --source=entsoe
                  - --start={{input.start}}
                  - --end={{input.end}}
                  - --refetch={{job.parameters.refetch}}
                  - --secret-scope=${var.secret_scope}
                  - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: backfill_fred
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          depends_on:
            - task_key: plan_months
            - task_key: markets_requested
              outcome: "true"
          for_each_task:
            inputs: "{{tasks.plan_months.values.months}}"
            concurrency: 2
            task:
              task_key: backfill_fred_month
              environment_key: ingest
              timeout_seconds: 600
              max_retries: 2
              min_retry_interval_millis: 120000
              python_wheel_task:
                package_name: energy_lakehouse
                entry_point: ingest
                parameters:
                  - --source=fred
                  - --start={{input.start}}
                  - --end={{input.end}}
                  - --refetch={{job.parameters.refetch}}
                  - --secret-scope=${var.secret_scope}
                  - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: backfill_stocks
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          depends_on:
            - task_key: plan_months
            - task_key: markets_requested
              outcome: "true"
          for_each_task:
            inputs: "{{tasks.plan_months.values.months}}"
            concurrency: 1
            task:
              task_key: backfill_stocks_month
              environment_key: ingest
              timeout_seconds: 600
              max_retries: 2
              min_retry_interval_millis: 120000
              python_wheel_task:
                package_name: energy_lakehouse
                entry_point: ingest
                parameters:
                  - --source=stocks
                  - --start={{input.start}}
                  - --end={{input.end}}
                  - --refetch={{job.parameters.refetch}}
                  - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: backfill_gas
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          depends_on:
            - task_key: plan_months
            - task_key: markets_requested
              outcome: "true"
          for_each_task:
            inputs: "{{tasks.plan_months.values.months}}"
            concurrency: 1
            task:
              task_key: backfill_gas_month
              environment_key: ingest
              timeout_seconds: 600
              max_retries: 2
              min_retry_interval_millis: 120000
              python_wheel_task:
                package_name: energy_lakehouse
                entry_point: ingest
                parameters:
                  - --source=gas
                  - --start={{input.start}}
                  - --end={{input.end}}
                  - --refetch={{job.parameters.refetch}}
                  - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        # Past week-ahead weather forecasts (Open-Meteo Previous Runs API, no key), for
        # backtesting the outlook. Free tier: 10,000 calls a day, and the full history from
        # Mar 2024 is about 11,000, so a first full backfill may stop partway with HTTP 429.
        # Rerun it the next day: months already landed are skipped.
        - task_key: backfill_weather_forecast_archive
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          depends_on:
            - task_key: plan_months
            - task_key: markets_requested
              outcome: "true"
          for_each_task:
            inputs: "{{tasks.plan_months.values.months}}"
            concurrency: 1
            task:
              task_key: backfill_weather_forecast_archive_month
              environment_key: ingest
              timeout_seconds: 900
              max_retries: 1
              min_retry_interval_millis: 300000
              python_wheel_task:
                package_name: energy_lakehouse
                entry_point: ingest
                parameters:
                  - --source=weather_forecast_archive
                  - --start={{input.start}}
                  - --end={{input.end}}
                  - --refetch={{job.parameters.refetch}}
                  - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: weather_requested
          depends_on:
            - task_key: plan_months
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.plan_months.values.run_weather}}"
            right: "true"

        - task_key: backfill_era5
          email_notifications:                       # job-level alerts skip SUCCESS_WITH_FAILURES
            on_failure: [ "${var.alert_email}" ]
          depends_on:
            - task_key: plan_months
            - task_key: weather_requested
              outcome: "true"
          for_each_task:
            inputs: "{{tasks.plan_months.values.months}}"
            concurrency: 2
            task:
              task_key: backfill_era5_month
              environment_key: ingest
              timeout_seconds: 5400
              max_retries: 1
              python_wheel_task:
                package_name: energy_lakehouse
                entry_point: ingest
                parameters:
                  - --source=era5
                  - --start={{input.start}}
                  - --end={{input.end}}
                  - --refetch={{job.parameters.refetch}}
                  - --secret-scope=${var.secret_scope}
                  - --landing-root=/Volumes/${var.catalog}/${resources.schemas.raw.name}/landing

        - task_key: refresh_pipeline
          # Once, after every source has finished, whatever their outcome: a for_each with one
          # failed month still landed the others, and they shouldn't be held back. A failed
          # source leaves the run as SUCCESS_WITH_FAILURES and emails via its own alert.
          run_if: ALL_DONE
          depends_on:
            - task_key: backfill_elexon
            - task_key: backfill_entsoe
            - task_key: backfill_fred
            - task_key: backfill_stocks
            - task_key: backfill_gas
            - task_key: backfill_weather_forecast_archive
            - task_key: backfill_era5
          pipeline_task:
            pipeline_id: ${resources.pipelines.energy_pipeline.id}
            full_refresh: false

    # Read-only data checks (energy_lakehouse/checks.py): tables populated, current silver
    # rows unique, GB and EU prices fresh, no incomplete settlement days, prices in range.
    # CI runs it after every deploy, in the ci copy and in prod; fails if any required check does.
    #
    #   databricks bundle run -t prod energy_checks
    energy_checks:
      name: energy-checks
      max_concurrent_runs: 1
      timeout_seconds: 1200
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tags:
        project: energy-markets-lakehouse
      parameters:
        - name: max_age_days                       # how stale GB/EU prices may be
          default: "3"
      environments:
        - environment_key: ingest
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: check_lakehouse
          environment_key: ingest
          timeout_seconds: 900
          python_wheel_task:
            package_name: energy_lakehouse
            entry_point: check_lakehouse
            parameters:
              - --catalog=${var.catalog}
              - --silver-schema=${resources.schemas.silver.name}
              - --gold-schema=${resources.schemas.gold.name}
              - --max-age-days={{job.parameters.max_age_days}}
