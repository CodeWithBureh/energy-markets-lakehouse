# The AI/BI dashboard: week-ahead outlook, market and platform health.
# The .lvdash.json is generated by dashboards/build.py from SQL files; edit those, rebuild,
# and deploy. Each target's dashboard reads its own catalog and gold schema.
# Viewers query with their own permissions (embed_credentials: false), so they need
# SELECT on gold, and on system.billing and system.lakeflow for the platform page.

resources:
  dashboards:
    energy_lakehouse:
      display_name: GB Energy Markets Lakehouse
      file_path: ../dashboards/energy_lakehouse.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${resources.schemas.gold.name}
      embed_credentials: false
