# Backfill plan for scripts/backfill.py, which starts the energy_backfill job once.
# The job loops over the months inside Databricks (one month per iteration, per source)
# and refreshes the pipeline once at the end.
#
#   python scripts/backfill.py --dry-run     # show the months it would run
#   python scripts/backfill.py               # start the job and wait for it
#
# If some months fail, use "Repair run" on the job run: it reruns only those months.

target = "prod"            # bundle target: "dev" or "prod"

start_month = "2024-01"
end_month = "current"      # "current" = this month up to yesterday, or e.g. "2024-12"

# To run specific months only, list them here; this overrides start_month/end_month.
# months = ["2024-03", "2024-10"]

# ERA5 weather too? Slow: the Copernicus queue can take up to an hour per month.
include_weather = false
# ERA5 only, skipping Elexon / ENTSO-E / FRED / stocks (overrides include_weather).
weather_only = false
