[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy_lakehouse"
version = "0.1.0"
description = "Ingestion library for the GB energy markets lakehouse (Elexon, ENTSO-E, FRED, equities, ERA5)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "cdsapi>=0.7.4",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2"]

[project.scripts]
# Used by the Databricks python_wheel_task (entry_point: ingest)
ingest = "energy_lakehouse.cli:main"
# First task of the energy_backfill job: publishes the months for the for_each tasks
plan_backfill = "energy_lakehouse.backfill:plan_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["energy_lakehouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
