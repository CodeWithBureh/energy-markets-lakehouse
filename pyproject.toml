[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy_lakehouse"
version = "0.1.0"
description = "Ingestion library for the GB energy markets lakehouse (Elexon, ENTSO-E, FRED, equities, ERA5)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "cdsapi>=0.7.4",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "build>=1.2"]

[project.scripts]
# Used by the Databricks python_wheel_task (entry_point: ingest). The run wrappers raise on
# a non-zero exit code, because the task ignores return values.
ingest = "energy_lakehouse.cli:run"
# First task of the energy_backfill job: publishes the months for the for_each tasks
plan_backfill = "energy_lakehouse.backfill:plan_run"
# energy_checks job: post-deploy data checks (freshness, uniqueness, completeness)
check_lakehouse = "energy_lakehouse.checks:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["energy_lakehouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
