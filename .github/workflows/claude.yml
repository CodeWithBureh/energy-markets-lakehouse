# Mention @claude in an issue, pull request or review comment (the GitHub mobile app works)
# and Claude Code answers there: questions about a failure, "fix this", changes to a pull
# request. Only the repository owner can trigger it: the repository is public and each
# run is billed to the owner's API key. It never merges.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: databricks/setup-cli@v1.26.0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 60
            --append-system-prompt "Pull requests go against dev; end their bodies with '🤖 Generated with [Claude Code](https://claude.com/claude-code)'. Never merge, push to dev or main, run or repair Databricks jobs, or run terraform: merging to dev deploys prod. Databricks access is read-only inspection of job runs."
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh issue:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(databricks jobs get-run:*),Bash(databricks jobs get-run-output:*),Bash(databricks jobs list-runs:*),Bash(databricks jobs list:*),Bash(python -m pytest:*),Bash(ruff:*),Bash(ls:*),Bash(cat:*)"
